name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 style

  # ---------------------------------------------------------------------------
  # Transpile jobs — one per language, upload artifacts for downstream jobs
  # ---------------------------------------------------------------------------

  transpile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: |
          just -f justfile.v2 _transpile-tongues python
          just -f justfile.v2 _transpile-harness python
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-python
          path: |
            tongues/.out/tongues.py
            tongues/.out/test_harness.py

  transpile-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: |
          just -f justfile.v2 _transpile-tongues ruby
          just -f justfile.v2 _transpile-harness ruby
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-ruby
          path: |
            tongues/.out/tongues.rb
            tongues/.out/test_harness.rb

  transpile-perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: |
          just -f justfile.v2 _transpile-tongues perl
          just -f justfile.v2 _transpile-harness perl
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-perl
          path: |
            tongues/.out/tongues.pl
            tongues/.out/test_harness.pl

  transpile-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: |
          just -f justfile.v2 _transpile-tongues javascript
          just -f justfile.v2 _transpile-harness javascript
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-javascript
          path: |
            tongues/.out/tongues.js
            tongues/.out/test_harness.js

  # ---------------------------------------------------------------------------
  # Python: test, retranspile, fixed-point, pyright
  # ---------------------------------------------------------------------------

  test-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: .
      - run: python3 tongues/tests/test-transpiled.py tongues/.out/tongues.py

  retranspile-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 _retranspile python

  fixed-point-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 fixed-point python

  pyright:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 _pyright

  # ---------------------------------------------------------------------------
  # Ruby: test, retranspile, fixed-point
  # ---------------------------------------------------------------------------

  test-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: .
      - run: ruby tongues/tests/test-transpiled.rb tongues/.out/tongues.rb

  retranspile-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 _retranspile ruby

  fixed-point-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 fixed-point ruby

  # ---------------------------------------------------------------------------
  # Perl: test, retranspile, fixed-point
  # ---------------------------------------------------------------------------

  test-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: .
      - run: perl tongues/tests/test-transpiled.pl tongues/.out/tongues.pl

  retranspile-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 _retranspile perl

  fixed-point-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 fixed-point perl

  # ---------------------------------------------------------------------------
  # JavaScript: test, fixed-point (no retranspile, pending #224)
  # ---------------------------------------------------------------------------

  test-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: .
      - run: node tongues/tests/test-transpiled.js tongues/.out/tongues.js

  fixed-point-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: .
      - uses: extractions/setup-just@v3
      - run: just -f justfile.v2 fixed-point javascript

  # ---------------------------------------------------------------------------
  # Gate — single status check for branch protection
  # ---------------------------------------------------------------------------

  check:
    if: always()
    needs:
      - style
      - test-python
      - retranspile-python
      - fixed-point-python
      - pyright
      - test-ruby
      - retranspile-ruby
      - fixed-point-ruby
      - test-perl
      - retranspile-perl
      - fixed-point-perl
      - test-javascript
      - fixed-point-javascript
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in \
            "${{ needs.style.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs.retranspile-python.result }}" \
            "${{ needs.fixed-point-python.result }}" \
            "${{ needs.pyright.result }}" \
            "${{ needs.test-ruby.result }}" \
            "${{ needs.retranspile-ruby.result }}" \
            "${{ needs.fixed-point-ruby.result }}" \
            "${{ needs.test-perl.result }}" \
            "${{ needs.retranspile-perl.result }}" \
            "${{ needs.fixed-point-perl.result }}" \
            "${{ needs.test-javascript.result }}" \
            "${{ needs.fixed-point-javascript.result }}"; do
            if [ "$result" != "success" ]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
