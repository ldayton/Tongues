name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 style

  # ---------------------------------------------------------------------------
  # Transpile jobs — one per language, upload artifacts for downstream jobs
  # ---------------------------------------------------------------------------

  transpile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-python docker/python
      - run: |
          docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _transpile-tongues python
          docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _transpile-harness python
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-python
          path: |
            tongues/.out/tongues.py
            tongues/.out/test_harness.py

  transpile-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-ruby docker/ruby
      - run: |
          docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 _transpile-tongues ruby
          docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 _transpile-harness ruby
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-ruby
          path: |
            tongues/.out/tongues.rb
            tongues/.out/test_harness.rb

  transpile-perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-perl docker/perl
      - run: |
          docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 _transpile-tongues perl
          docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 _transpile-harness perl
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-perl
          path: |
            tongues/.out/tongues.pl
            tongues/.out/test_harness.pl

  transpile-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-javascript docker/javascript
      - run: |
          docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 _transpile-tongues javascript
          docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 _transpile-harness javascript
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-javascript
          path: |
            tongues/.out/tongues.js
            tongues/.out/test_harness.js

  transpile-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _transpile-tongues java
      - uses: actions/upload-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out/tongues.java

  # ---------------------------------------------------------------------------
  # Python: test, idempotence, treewalker, vm, pyright
  # ---------------------------------------------------------------------------

  test-tongues-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python
          python3 tongues/tests/test-transpiled.py .out/tongues.py

  idempotence:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 idempotence

  pyright:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _pyright

  treewalker-apptests-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _treewalker python

  vm-apptests-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _vm python

  # ---------------------------------------------------------------------------
  # Ruby: test, cross-equivalence, treewalker, vm
  # ---------------------------------------------------------------------------

  test-tongues-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: tongues/.out
      - run: docker build -t tongues-ruby docker/ruby
      - run: docker run --rm -v $PWD:/workspace tongues-ruby
          ruby tongues/tests/test-transpiled.rb .out/tongues.rb

  cross-equivalence-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: tongues/.out
      - run: docker build -t tongues-ruby docker/ruby
      - run: docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 cross-equivalence ruby

  treewalker-apptests-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: tongues/.out
      - run: docker build -t tongues-ruby docker/ruby
      - run: docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 _treewalker ruby

  vm-apptests-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: tongues/.out
      - run: docker build -t tongues-ruby docker/ruby
      - run: docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 _vm ruby

  # ---------------------------------------------------------------------------
  # Perl: test, cross-equivalence, treewalker, vm
  # ---------------------------------------------------------------------------

  test-tongues-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: tongues/.out
      - run: docker build -t tongues-perl docker/perl
      - run: docker run --rm -v $PWD:/workspace tongues-perl
          perl tongues/tests/test-transpiled.pl .out/tongues.pl

  cross-equivalence-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: tongues/.out
      - run: docker build -t tongues-perl docker/perl
      - run: docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 cross-equivalence perl

  treewalker-apptests-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: tongues/.out
      - run: docker build -t tongues-perl docker/perl
      - run: docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 _treewalker perl

  vm-apptests-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: tongues/.out
      - run: docker build -t tongues-perl docker/perl
      - run: docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 _vm perl

  # ---------------------------------------------------------------------------
  # JavaScript: test, cross-equivalence, treewalker, vm
  # ---------------------------------------------------------------------------

  test-tongues-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: tongues/.out
      - run: docker build -t tongues-javascript docker/javascript
      - run: docker run --rm -v $PWD:/workspace tongues-javascript
          node tongues/tests/test-transpiled.js .out/tongues.js

  cross-equivalence-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: tongues/.out
      - run: docker build -t tongues-javascript docker/javascript
      - run: docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 cross-equivalence javascript

  treewalker-apptests-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: tongues/.out
      - run: docker build -t tongues-javascript docker/javascript
      - run: docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 _treewalker javascript

  vm-apptests-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: tongues/.out
      - run: docker build -t tongues-javascript docker/javascript
      - run: docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 _vm javascript

  # ---------------------------------------------------------------------------
  # Java: compile, test, cross-equivalence, treewalker, vm
  # ---------------------------------------------------------------------------

  compile-java:
    runs-on: ubuntu-latest
    needs: transpile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _compile-java
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes/

  test-tongues-java:
    runs-on: ubuntu-latest
    needs: compile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - uses: actions/download-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _test-tongues-java

  cross-equivalence-java:
    runs-on: ubuntu-latest
    needs: compile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - uses: actions/download-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 cross-equivalence java

  treewalker-apptests-java:
    runs-on: ubuntu-latest
    needs: compile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - uses: actions/download-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _treewalker-java

  vm-apptests-java:
    runs-on: ubuntu-latest
    needs: compile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - uses: actions/download-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _vm-java

  # ---------------------------------------------------------------------------
  # Taytsh VM: full tongues test suite through VM per language
  # ---------------------------------------------------------------------------

  vm-test-tongues-javascript:
    runs-on: ubuntu-latest
    needs: transpile-javascript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-javascript
          path: tongues/.out
      - run: docker build -t tongues-javascript docker/javascript
      - run: docker run --rm -v $PWD:/workspace tongues-javascript just -f justfile.v2 _vm-test-tongues javascript

  vm-test-tongues-perl:
    runs-on: ubuntu-latest
    needs: transpile-perl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-perl
          path: tongues/.out
      - run: docker build -t tongues-perl docker/perl
      - run: docker run --rm -v $PWD:/workspace tongues-perl just -f justfile.v2 _vm-test-tongues perl

  vm-test-tongues-ruby:
    runs-on: ubuntu-latest
    needs: transpile-ruby
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-ruby
          path: tongues/.out
      - run: docker build -t tongues-ruby docker/ruby
      - run: docker run --rm -v $PWD:/workspace tongues-ruby just -f justfile.v2 _vm-test-tongues ruby

  vm-test-tongues-python:
    runs-on: ubuntu-latest
    needs: transpile-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-python
          path: tongues/.out
      - run: docker build -t tongues-python docker/python
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _vm-test-tongues python

  vm-test-tongues-java:
    runs-on: ubuntu-latest
    needs: compile-java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: transpiled-java
          path: tongues/.out
      - uses: actions/download-artifact@v4
        with:
          name: compiled-java
          path: tongues/.out/java-classes
      - run: docker build -t tongues-java docker/java
      - run: docker run --rm -v $PWD:/workspace tongues-java just -f justfile.v2 _vm-test-tongues-java

  # ---------------------------------------------------------------------------
  # Generative / property-based tests
  # ---------------------------------------------------------------------------

  pytest-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t tongues-python docker/python
      - run: docker save tongues-python -o /tmp/tongues-python.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-python
          path: /tmp/tongues-python.tar

  pytest-gen-tycheck:
    runs-on: ubuntu-latest
    needs: pytest-gen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: docker-python
          path: /tmp
      - run: docker load -i /tmp/tongues-python.tar
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _pytest-gen-tycheck

  pytest-gen-softfloat:
    runs-on: ubuntu-latest
    needs: pytest-gen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: docker-python
          path: /tmp
      - run: docker load -i /tmp/tongues-python.tar
      - run: docker run --rm -v $PWD:/workspace tongues-python just -f justfile.v2 _pytest-gen-softfloat

  # ---------------------------------------------------------------------------
  # Gate — single status check for branch protection
  # ---------------------------------------------------------------------------

  check:
    if: always()
    needs:
      - style
      - pytest-gen-tycheck
      - pytest-gen-softfloat
      - test-tongues-python
      - idempotence
      - treewalker-apptests-python
      - vm-apptests-python
      - vm-test-tongues-python
      - pyright
      - test-tongues-ruby
      - cross-equivalence-ruby
      - treewalker-apptests-ruby
      - vm-apptests-ruby
      - vm-test-tongues-ruby
      - test-tongues-perl
      - cross-equivalence-perl
      - treewalker-apptests-perl
      - vm-apptests-perl
      - vm-test-tongues-perl
      - test-tongues-javascript
      - cross-equivalence-javascript
      - treewalker-apptests-javascript
      - vm-apptests-javascript
      - vm-test-tongues-javascript
      - compile-java
      - test-tongues-java
      - cross-equivalence-java
      - treewalker-apptests-java
      - vm-apptests-java
      - vm-test-tongues-java
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in \
            "${{ needs.style.result }}" \
            "${{ needs.pytest-gen-tycheck.result }}" \
            "${{ needs.pytest-gen-softfloat.result }}" \
            "${{ needs.test-tongues-python.result }}" \
            "${{ needs.idempotence.result }}" \
            "${{ needs.treewalker-apptests-python.result }}" \
            "${{ needs.vm-apptests-python.result }}" \
            "${{ needs.vm-test-tongues-python.result }}" \
            "${{ needs.pyright.result }}" \
            "${{ needs.test-tongues-ruby.result }}" \
            "${{ needs.cross-equivalence-ruby.result }}" \
            "${{ needs.treewalker-apptests-ruby.result }}" \
            "${{ needs.vm-apptests-ruby.result }}" \
            "${{ needs.vm-test-tongues-ruby.result }}" \
            "${{ needs.test-tongues-perl.result }}" \
            "${{ needs.cross-equivalence-perl.result }}" \
            "${{ needs.treewalker-apptests-perl.result }}" \
            "${{ needs.vm-apptests-perl.result }}" \
            "${{ needs.vm-test-tongues-perl.result }}" \
            "${{ needs.test-tongues-javascript.result }}" \
            "${{ needs.cross-equivalence-javascript.result }}" \
            "${{ needs.treewalker-apptests-javascript.result }}" \
            "${{ needs.vm-apptests-javascript.result }}" \
            "${{ needs.vm-test-tongues-javascript.result }}" \
            "${{ needs.compile-java.result }}" \
            "${{ needs.test-tongues-java.result }}" \
            "${{ needs.cross-equivalence-java.result }}" \
            "${{ needs.treewalker-apptests-java.result }}" \
            "${{ needs.vm-apptests-java.result }}" \
            "${{ needs.vm-test-tongues-java.result }}"; do
            if [ "$result" != "success" ]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
