name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just style

  frontend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-frontend

  middleend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-middleend

  taytsh:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-taytsh

  backend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-backend

  lib:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-lib

  lang-python:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-python

  lang-ruby:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: extractions/setup-just@v3
      - run: just lang-ruby

  lang-perl:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-perl

  check:
    if: always()
    needs: [style, frontend, middleend, taytsh, backend, lib, lang-python, lang-ruby, lang-perl]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.style.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.middleend.result }}" != "success" || "${{ needs.taytsh.result }}" != "success" || "${{ needs.backend.result }}" != "success" || "${{ needs.lib.result }}" != "success" || "${{ needs.lang-python.result }}" != "success" || "${{ needs.lang-ruby.result }}" != "success" || "${{ needs.lang-perl.result }}" != "success" ]]; then
            exit 1
          fi
