name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just style

  test-frontend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-frontend

  test-middleend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-middleend

  test-taytsh:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-taytsh

  test-backend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-backend

  test-lib:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-lib

  lang-python:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-python

  lang-javascript:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: extractions/setup-just@v3
      - run: just lang-javascript

  lang-ruby:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: extractions/setup-just@v3
      - run: just lang-ruby

  lang-perl:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-perl

  lang-taytsh:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just _self-transpile taytsh
      - uses: actions/upload-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out/tongues.ty

  tw-frontend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-treewalker-frontend

  tw-middleend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-treewalker-middleend

  tw-backend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-treewalker-backend

  tw-apptest:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-treewalker-apptest

  vm-frontend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-vm-frontend

  vm-middleend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-vm-middleend

  vm-backend:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-vm-backend

  vm-apptest:
    runs-on: ubuntu-latest
    needs: lang-taytsh
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tongues-ty
          path: tongues/.out
      - uses: extractions/setup-just@v3
      - run: just _lang-taytsh-vm-apptest

  fixed-point:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just fixed-point

  check:
    if: always()
    needs: [style, test-frontend, test-middleend, test-taytsh, test-backend, test-lib, lang-python, lang-javascript, lang-ruby, lang-perl, tw-frontend, tw-middleend, tw-backend, tw-apptest, vm-frontend, vm-middleend, vm-backend, vm-apptest, fixed-point]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.style.result }}" != "success" || "${{ needs.test-frontend.result }}" != "success" || "${{ needs.test-middleend.result }}" != "success" || "${{ needs.test-taytsh.result }}" != "success" || "${{ needs.test-backend.result }}" != "success" || "${{ needs.test-lib.result }}" != "success" || "${{ needs.lang-python.result }}" != "success" || "${{ needs.lang-javascript.result }}" != "success" || "${{ needs.lang-ruby.result }}" != "success" || "${{ needs.lang-perl.result }}" != "success" || "${{ needs.tw-frontend.result }}" != "success" || "${{ needs.tw-middleend.result }}" != "success" || "${{ needs.tw-backend.result }}" != "success" || "${{ needs.tw-apptest.result }}" != "success" || "${{ needs.vm-frontend.result }}" != "success" || "${{ needs.vm-middleend.result }}" != "success" || "${{ needs.vm-backend.result }}" != "success" || "${{ needs.vm-apptest.result }}" != "success" || "${{ needs.fixed-point.result }}" != "success" ]]; then
            exit 1
          fi
