name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just style

  test-frontend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-frontend

  test-middleend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-middleend

  test-taytsh:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-taytsh

  test-backend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-backend

  test-lib:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-lib

  lang-python:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-python

  lang-ruby:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: extractions/setup-just@v3
      - run: just lang-ruby

  lang-perl:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-perl

  lang-taytsh-treewalker-frontend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just _self-transpile taytsh && just _lang-taytsh-treewalker-frontend

  lang-taytsh-treewalker-middleend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just _self-transpile taytsh && just _lang-taytsh-treewalker-middleend

  lang-taytsh-treewalker-backend:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just _self-transpile taytsh && just _lang-taytsh-treewalker-backend

  lang-taytsh-treewalker-apptest:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just _self-transpile taytsh && just _lang-taytsh-treewalker-apptest

  lang-taytsh-vm:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lang-taytsh-vm

  check:
    if: always()
    needs: [style, test-frontend, test-middleend, test-taytsh, test-backend, test-lib, lang-python, lang-ruby, lang-perl, lang-taytsh-treewalker-frontend, lang-taytsh-treewalker-middleend, lang-taytsh-treewalker-backend, lang-taytsh-treewalker-apptest, lang-taytsh-vm]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.style.result }}" != "success" || "${{ needs.test-frontend.result }}" != "success" || "${{ needs.test-middleend.result }}" != "success" || "${{ needs.test-taytsh.result }}" != "success" || "${{ needs.test-backend.result }}" != "success" || "${{ needs.test-lib.result }}" != "success" || "${{ needs.lang-python.result }}" != "success" || "${{ needs.lang-ruby.result }}" != "success" || "${{ needs.lang-perl.result }}" != "success" || "${{ needs.lang-taytsh-treewalker-frontend.result }}" != "success" || "${{ needs.lang-taytsh-treewalker-middleend.result }}" != "success" || "${{ needs.lang-taytsh-treewalker-backend.result }}" != "success" || "${{ needs.lang-taytsh-treewalker-apptest.result }}" != "success" || "${{ needs.lang-taytsh-vm.result }}" != "success" ]]; then
            exit 1
          fi
