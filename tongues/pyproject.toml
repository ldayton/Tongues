[project]
name = "tongues"
version = "0.2.4"
requires-python = "~=3.12.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "pebble>=5.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 5
timeout_method = "thread"

[tool.ruff.lint]
ignore = [
    # E402: Import not at top of file. Backends define helper functions before bulk imports.
    "E402",
    # E712: Comparison to True/False. App tests are transpiled Python where `== True` is intentional.
    "E712",
    # E741: Ambiguous variable name (l/O/I). Intentional: `l, r = left, right` in backends.
    "E741",
    # F841: Unused variable. Pattern matching extracts unused bindings: `case Foo(x=x):`
    "F841",
]
